name: Automate Tests

on:
  push:
    branches: ["main", "gpt/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Lean 4
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Verify Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f lean-toolchain
          test -n "$(cat lean-toolchain)"
          command -v lean
          test "$(lean --version | grep -oE 'version [0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}')" = "4.34.1"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: Run test suite
        env:
          AUTOMATE_REQUIRE_LEAN: "1"
        run: python -m pytest -q

      - name: Run canonical demo
        env:
          AUTOMATE_REQUIRE_LEAN: "1"
        run: python -m automate.demo
