name: Automate Tests

on:
  push:
    branches: ["main", "gpt/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Lean 4
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Verify Lean toolchain
        run: |
          lean --version
          test -f lean-toolchain
          test -n "$(cat lean-toolchain)"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: Run test suite
        env:
          AUTOMATE_REQUIRE_LEAN: "1"
        run: python -m pytest -q

      - name: Run canonical demo
        env:
          AUTOMATE_REQUIRE_LEAN: "1"
        run: python -m automate.demo
