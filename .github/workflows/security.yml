name: Security Audit

on:
  push:
    branches:
      - main
      - engine
  pull_request:
    branches:
      - main
      - engine
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        # This repository does not have GitHub code-scanning storage enabled.
        # Keep CodeQL as a real local security analysis without making the
        # verification gate depend on the optional upload service.
        uses: github/codeql-action/analyze@v4
        with:
          upload: false

  dependency-audit:
    name: pip-audit / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit
