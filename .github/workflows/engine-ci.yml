name: Automate Engine CI

on:
  push:
    branches: [engine]
  pull_request:
    branches: [engine]
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  actions: read


concurrency:
  group: automate-engine-ci
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run installed first-frontier verification
        run: python -m automate.dev.verification_self_test
      - run: python -m automate.cli engine --json
