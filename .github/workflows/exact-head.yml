name: Exact-head

on:
  push:
    branches: [main]
concurrency:
  group: exact-head-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-head:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    name: Exact-head / Python ${{matrix.python-version}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{github.sha}}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full test suite
        run: pytest -q --tb=short --strict-markers
      - name: Run adversarial tests
        run: pytest tests/test_adversarial.py tests/test_claim_mutations.py -v --tb=short
      - name: Run exact 50-problem Maths/Physics acceptance campaign
        run: pytest tests/test_acceptance_campaign_50.py -q -s --tb=short
      - name: Run Phase 1A Linear Algebra Core acceptance campaign
        run: pytest tests/test_linear_algebra_acceptance.py -q -s --tb=short
      - name: Run Phase 1A Linear Algebra Eigenproblem acceptance campaign
        run: pytest tests/test_linear_algebra_eigen_acceptance.py -q -s --tb=short

  lean4:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    name: Exact-head / Lean 4 proof check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{github.sha}}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Install Lean 4.34.1
        run: |
          elan toolchain install leanprover/lean4:v4.34.1
          elan default leanprover/lean4:v4.34.1
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Lean backend tests
        run: pytest tests/test_lean_backend.py tests/test_adversarial.py::TestLeanBackendNoTautology -v --tb=short
        env:
          LEAN_BIN: ${{env.HOME}}
