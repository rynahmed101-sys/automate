name: Automate CI

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

# Automate uses two CI speeds on purpose:
# - Development/PR CI is fast feedback. It runs the full Python test suite on one
#   representative interpreter, but does not repeat the expensive platform/matrix
#   and formal-proof gate on every feature push.
# - Exact-head CI runs only after a commit lands on main. It is the authoritative
#   verification of the exact merged main SHA and retains the full verification
#   matrix, acceptance campaigns, and Lean proof check.
#
# This boundary is intentional and is part of the project operating policy.
# Do not move the heavyweight exact-head gate back onto every development push
# merely because it is convenient to enumerate every check in one job.

jobs:
  development:
    if: github.ref != 'refs/heads/main'
    name: Development / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run development test suite
        run: |
          pytest -q --tb=short --strict-markers

  exact-head:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.ref == 'refs/heads/main' && github.event.pull_request.merged == true)
    name: Exact-head / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          pytest -q --tb=short --strict-markers

      - name: Run adversarial tests explicitly (anti-circularity and mutation hardening)
        run: |
          pytest tests/test_adversarial.py tests/test_claim_mutations.py -v --tb=short

      - name: Run exact 50-problem Maths/Physics acceptance campaign
        run: |
          pytest tests/test_acceptance_campaign_50.py -q -s --tb=short

      - name: Run Phase 1A Linear Algebra Core acceptance campaign
        run: |
          pytest tests/test_linear_algebra_acceptance.py -q -s --tb=short

      - name: Run Phase 1A Linear Algebra Eigenproblem acceptance campaign
        run: |
          pytest tests/test_linear_algebra_eigen_acceptance.py -q -s --tb=short

  lean4:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    name: Exact-head / Lean 4 proof check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install elan (Lean 4 version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean 4.34.1
        run: |
          elan toolchain install leanprover/lean4:v4.34.1
          elan default leanprover/lean4:v4.34.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Lean backend tests (with Lean 4 available)
        run: |
          pytest tests/test_lean_backend.py tests/test_adversarial.py::TestLeanBackendNoTautology -v --tb=short
        env:
          LEAN_BIN: ${{ env.HOME }}/.elan/bin/lean
