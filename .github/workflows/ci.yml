name: Automate CI

on:
  push:
    branches:
      - "feat/**"
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          pytest -q --tb=short --strict-markers

      - name: Run adversarial tests explicitly (anti-circularity and mutation hardening)
        run: |
          pytest tests/test_adversarial.py tests/test_claim_mutations.py -v --tb=short

      - name: Run exact 50-problem Maths/Physics acceptance campaign
        run: |
          pytest tests/test_acceptance_campaign_50.py -q -s --tb=short

  lean4:
    name: Lean 4 proof check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install elan (Lean 4 version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean 4.34.1
        run: |
          elan toolchain install leanprover/lean4:v4.34.1
          elan default leanprover/lean4:v4.34.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Lean backend tests (with Lean 4 available)
        run: |
          pytest tests/test_lean_backend.py tests/test_adversarial.py::TestLeanBackendNoTautology -v --tb=short
        env:
          LEAN_BIN: ${{ env.HOME }}/.elan/bin/lean
