[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-physics"
version = "0.1.0"
description = "A unified computational framework for machine-checkable formal physics derivations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Automate Contributors"}
]
keywords = [
    "physics",
    "formal-methods",
    "lean4",
    "sympy",
    "computational-physics",
    "symbolic-mathematics",
    "derivation-graph",
    "mechanics"
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "mpmath>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "matplotlib>=3.7",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
automate = "automate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automate*"]
