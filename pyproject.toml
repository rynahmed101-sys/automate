[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-physics"
version = "0.3.0"
description = "A local-first mathematics and physics calculator for AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Automate Contributors"}
]
keywords = [
    "physics",
    "sympy",
    "computational-physics",
    "symbolic-mathematics",
    "mechanics"
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "mpmath>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "matplotlib>=3.7",
    "jsonschema>=4.20.0",
    "einsteinpy==0.4.0",
    "pint>=0.24.0",
    "lmfit>=1.2.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
automate = "automate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automate*"]

[tool.pytest.ini_options]
markers = [
    "different_engine: Test uses two independent computation engines (highest independence)",
    "same_engine_different_path: Test uses different code paths within the same engine",
    "same_engine: Test uses the same engine for both computation and verification",
    "textbook_reference: Test compares against a known analytic result from literature",
    "adversarial: Test attempts to fool the verification system",
    "trust_boundary: Test validates a trust boundary or security invariant",
]
